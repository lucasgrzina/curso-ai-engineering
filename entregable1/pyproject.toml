[project]
name = "cliente-llm-async"
version = "1.0.0"
description = "Entregable 1 - Cliente de LLM robusto y asincrono (OpenAI + Anthropic, Pydantic, streaming)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.5",
    "openai>=1.50",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_client"]
