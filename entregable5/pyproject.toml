[project]
name = "agente-react-memoria-persistente"
version = "1.0.0"
description = "Entregable 5 - Agente de razonamiento cíclico (ReAct) con LangGraph y memoria persistente en SQLite"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=2.1",
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]
