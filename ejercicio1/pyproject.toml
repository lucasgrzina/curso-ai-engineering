[project]
name = "orquestador-concurrente"
version = "1.0.0"
description = "Ejercicio 1 - Orquestador concurrente de modelos (Modulo 1: asyncio + gather + timeout + semaforo)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
orquestador = "orquestador.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orquestador"]
